[build]
  command = "pnpm build:web"
  publish = "dist"

[build.environment]
  # package.json의 packageManager(pnpm@11.25.0)는 Node 22.13+가 있어야 돈다(node:sqlite
  # 내장 모듈을 씀). NODE_VERSION="20"으로 고정돼 있던 탓에 2026-09-09부터 모든 배포가
  # "Install dependencies" 단계에서 "No such built-in module: node:sqlite"로 실패해 왔다
  # (실제 배포 로그로 확인, 2026-09-23). 로컬 Node는 24라 재현이 안 됐다.
  NODE_VERSION = "22"
  # 웹판(hongikon.com)은 같은 출처의 /api 로 부르고 아래 프록시가 api.hongikon.com 으로 넘긴다.
  # 백엔드에 CORS 설정을 열지 않아도 되고, 브라우저 입장에선 쿠키·헤더가 한 출처에만 오간다.
  EXPO_PUBLIC_API_BASE_URL = "/api"
  # 관리자 화면(/admin)의 카카오 로그인은 프록시(/api)가 아니라 API 도메인으로 직접 이동해야 한다
  # (OAuth state 세션 쿠키가 api.hongikon.com 에 붙어야 카카오 콜백에서 검증이 통과한다).
  EXPO_PUBLIC_API_ORIGIN = "https://api.hongikon.com"
  # app.config.ts 는 APP_VARIANT 가 없으면 개발(development)로 보고 이름 뒤에 " (개발)"을 붙인다.
  # 웹판은 운영 배포이므로 명시한다(없던 탓에 hongikon.com 탭 제목이 "홍익온 (개발)"이었다).
  APP_VARIANT = "production"

[[redirects]]
  from = "/api/*"
  to = "https://api.hongikon.com/:splat"
  status = 200
  force = true

# 단일 페이지 앱이라 /temp/dots 같은 경로로 새로고침해도 index.html 을 돌려준다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 보안 헤더. CSP는 아직 강제(enforcing)로 안 넣었다 — 네이버 지도 SDK(oapi.map.naver.com)가
# 실제로 쓰는 타일·리소스 도메인을 전부 확정하지 못한 채 script-src를 걸면 지도가 조용히
# 안 뜰 수 있다(웹판 NaverMapView.web.tsx 참고). 대신 Report-Only로 걸어 둔다 — 이 헤더는
# 아무것도 차단하지 않고 위반만 브라우저 콘솔에 기록하므로 지도가 깨질 위험이 없다. 배포 후
# 콘솔에 위반 로그가 안 남으면 그대로 Content-Security-Policy(강제)로 이름만 바꾸면 된다.
# 파비콘은 브라우저가 특히 오래 붙잡는다 — 주소 고정인 /favicon.ico 는 매번 새 버전인지 확인하게 한다.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), payment=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://oapi.map.naver.com https://*.pstatic.net https://*.naver.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://*.naver.com https://*.naver.net https://*.pstatic.net; font-src 'self' data:; frame-ancestors 'none'"

# 파일 이름에 내용 해시가 붙는 정적 자산은 1년 동안 다시 확인하지 않는다(내용이 바뀌면 이름이 바뀐다).
# - /_expo/static/*: JS 번들(index-<hash>.js, 지연 로드 청크)
# - /assets/*: 폰트·이미지(<name>.<hash>.<ext>). scripts/fix-web-export.mjs 가 node_modules 경로를
#   /assets/nm/pnpm/... 로 옮긴 아이콘 폰트도 여기에 들어간다.
# index.html·map.html·favicon 처럼 주소가 고정인 파일은 넣지 않는다(새 배포를 바로 받아야 한다).
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API 응답(인증·제보 등 사용자별 데이터)이 브라우저·중간 캐시에 남지 않게 한다.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
