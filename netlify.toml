[build]
  command = "pnpm build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # 웹판(hongikon.com)은 같은 출처의 /api 로 부르고 아래 프록시가 api.hongikon.com 으로 넘긴다.
  # 백엔드에 CORS 설정을 열지 않아도 되고, 브라우저 입장에선 쿠키·헤더가 한 출처에만 오간다.
  EXPO_PUBLIC_API_BASE_URL = "/api"

[[redirects]]
  from = "/api/*"
  to = "https://api.hongikon.com/:splat"
  status = 200
  force = true

# 단일 페이지 앱이라 /temp/dots 같은 경로로 새로고침해도 index.html 을 돌려준다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 보안 헤더. CSP는 아직 안 넣었다 — 네이버 지도 SDK 스크립트 도메인을 확정하지 않고
# script-src를 걸면 지도가 조용히 안 뜰 수 있어(웹판 NaverMapView.web.tsx 참고),
# 실제 허용 도메인 목록을 확인한 뒤 별도로 추가한다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), payment=()"

# API 응답(인증·제보 등 사용자별 데이터)이 브라우저·중간 캐시에 남지 않게 한다.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
