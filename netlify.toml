[build]
  command = "pnpm build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # 웹판은 https(Netlify)인데 백엔드는 아직 http라 브라우저가 직접 호출을 막는다(mixed content).
  # 같은 출처의 /api 로 부르고 아래 프록시가 백엔드로 넘긴다 — CORS 설정도 필요 없어진다.
  # 백엔드에 도메인+SSL이 붙으면 이 값과 프록시를 https 주소로 바꾼다.
  EXPO_PUBLIC_API_BASE_URL = "/api"

[[redirects]]
  from = "/api/*"
  to = "http://54.180.195.51/:splat"
  status = 200
  force = true

# 단일 페이지 앱이라 /temp/dots 같은 경로로 새로고침해도 index.html 을 돌려준다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 보안 헤더. CSP는 아직 안 넣었다 — 네이버 지도 SDK 스크립트 도메인을 확정하지 않고
# script-src를 걸면 지도가 조용히 안 뜰 수 있어(웹판 NaverMapView.web.tsx 참고),
# 실제 허용 도메인 목록을 확인한 뒤 별도로 추가한다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), payment=()"

# API 응답(인증·제보 등 사용자별 데이터)이 브라우저·중간 캐시에 남지 않게 한다.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
